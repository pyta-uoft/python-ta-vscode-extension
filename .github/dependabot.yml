version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: 'uv'
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: 'npm'
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
      - dependency-name: 'vscode-languageclient'
